<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Offline RAG System Architecture</title><style>:root{--bg:#F0F4EF;--ink:#26362B;--muted:#6C7A6F;--line:#D5E0D5;--card:#FFFFFF;--a:#3D7858;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,56px);background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto}.tag{color:var(--a);text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;font-weight:800}h1{font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:36px 0}.stage{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:200px;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}.stage:hover,.stage:focus-visible,.stage[aria-pressed=true]{transform:translateY(-5px);border-color:var(--a);outline:none}.stage h2{font-size:1.1rem}.stage p{font-size:.9rem}.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}</style></head><body><main><div class="tag">Interactive architecture</div><h1>Local Offline RAG System</h1><p>Build a local-first document assistant with private retrieval and local generation. Select a stage to inspect its role.</p><section class="grid"><button class="stage" type="button" aria-pressed="true" data-i="0"><span class="tag">Stage 1 / DOCUMENTS</span><h2>Local files</h2><p>Select the files to index.</p></button><button class="stage" type="button" aria-pressed="false" data-i="1"><span class="tag">Stage 2 / INGEST</span><h2>Chunk + embed</h2><p>Prepare text and embeddings.</p></button><button class="stage" type="button" aria-pressed="false" data-i="2"><span class="tag">Stage 3 / RETRIEVE</span><h2>Local vector search</h2><p>Find relevant passages.</p></button><button class="stage" type="button" aria-pressed="false" data-i="3"><span class="tag">Stage 4 / GENERATE</span><h2>Local model</h2><p>Answer using retrieved context.</p></button></section><section class="detail" aria-live="polite"><h2 id="heading">Local files</h2><p id="body">Select the files to index.</p></section><p><a href="https://github.com/chyk2468/Local-Offline-RAG-System" style="color:var(--a)">View repository</a></p></main><script>const stages=[["DOCUMENTS","Local files","Select the files to index."],["INGEST","Chunk + embed","Prepare text and embeddings."],["RETRIEVE","Local vector search","Find relevant passages."],["GENERATE","Local model","Answer using retrieved context."]];document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.querySelector('#heading').textContent=stages[+b.dataset.i][1];document.querySelector('#body').textContent=stages[+b.dataset.i][2]}))</script></body></html>
